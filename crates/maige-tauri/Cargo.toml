[package]
name = "maige"
version = "0.1.0"
description = "Maige — professional desktop image editor (Tauri shell)"
authors = ["Dileep Pandey"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core image processing — all pixel work lives in maige-core
maige-core = { path = "../maige-core" }

# Tauri runtime + plugins
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Image crate for thumbnail generation in database
image = { version = "0.24", features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }

# Error handling
anyhow = "1.0"

# HTTP client for Ollama AI integration
reqwest = { version = "0.12", features = ["json"] }

# Base64 (face thumbnail encoding)
base64 = "0.22"

# Face recognition via ONNX Runtime
# load-dynamic: load onnxruntime.dll at runtime (avoids LNK2001 with static lib on MSVC)
# copy-dylibs: copies onnxruntime.dll next to the binary automatically
# download-binaries: fetches the prebuilt ORT binaries (dll + lib) from pyke CDN
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24"] }
ndarray = "0.17"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
